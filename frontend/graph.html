<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Graph — CineGraph</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.graph-controls{
  padding:.75rem 2rem;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:.8rem;
  flex-wrap:wrap;
  background:var(--s1);
}
.graph-controls h2{
  font-family:var(--serif);
  font-size:1.3rem;
  font-style:italic;
  margin-right:auto;
  color:var(--text);
}
.gc-btn{
  background:var(--s2);
  border:1px solid var(--border);
  color:var(--muted);
  font-family:var(--mono);
  font-size:.65rem;
  padding:.35rem .85rem;
  border-radius:6px;
  cursor:pointer;
  transition:all .18s;
  letter-spacing:.04em;
}
.gc-btn:hover{ border-color:var(--gold); color:var(--text); }
.gc-btn.on{ background:var(--gold); color:#07070f; border-color:var(--gold); }
.gl{ display:flex; gap:1.2rem; align-items:center; }
.gl-i{ display:flex; align-items:center; gap:.4rem; font-family:var(--mono); font-size:.62rem; color:var(--muted); }
.gl-d{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.canvas-wrap{ width:100%; position:relative; overflow:hidden; background:#07070f; }
#graph-canvas{ width:100%; cursor:grab; display:block; }
#graph-canvas:active{ cursor:grabbing; }
.graph-footer{
  padding:.55rem 2rem;
  font-family:var(--mono);
  font-size:.62rem;
  color:var(--muted);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--s1);
}
.graph-footer span:first-child{ opacity:.6; }
#node-tooltip{
  position:absolute;
  background:var(--s1);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:.55rem .85rem;
  font-family:var(--mono);
  font-size:.72rem;
  color:var(--text);
  pointer-events:none;
  opacity:0;
  transition:opacity .15s;
  max-width:200px;
  z-index:10;
  line-height:1.5;
}
#node-tooltip.show{ opacity:1; }
</style>
</head>
<body>
<nav id="nav-root"></nav>
<div id="toast"></div>

<div class="page-wrap" style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="graph-controls">
    <h2>Bipartite Graph</h2>
    <div class="gl">
      <div class="gl-i"><div class="gl-d" style="background:#5b8dee"></div>Users</div>
      <div class="gl-i"><div class="gl-d" style="background:#e8c97a"></div>You</div>
      <div class="gl-i"><div class="gl-d" style="background:#4ecb7f"></div>Watched by you</div>
      <div class="gl-i"><div class="gl-d" style="background:#c8b878"></div>Other movies</div>
    </div>
    <button class="gc-btn on" id="gbtn-yours">Your Network</button>
    <button class="gc-btn" id="gbtn-full">Full Sample</button>
    <button class="gc-btn" id="gbtn-reset">Reset View</button>
  </div>

  <div class="canvas-wrap" id="canvas-wrap" style="flex:1;position:relative;">
    <canvas id="graph-canvas"></canvas>
    <div id="node-tooltip"></div>
  </div>

  <div class="graph-footer">
    <span>Click a movie to open it · Drag to pan · Scroll to zoom</span>
    <span id="graph-stat"></span>
  </div>
</div>

<script>
// ─── state ───────────────────────────────────────────────
var gNodes = [], gEdges = [], gMode = 'yours';
var gPan = {x: 0, y: 0}, gZoom = 1;
var canvas, ctx, W, H;
var isDragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};
var hoveredNode = null;

// ─── helpers ─────────────────────────────────────────────
function minfo(mid) { return DB.movies[String(mid)] || null; }
function cleanTitle(t) {
  if (!t) return '?';
  return t.replace(/\s*\(\d{4}\)\s*$/, '').replace(/^(The|A|An)\s+(.+),\s+(The|A|An)$/i, '$3 $2');
}

// ─── canvas setup ────────────────────────────────────────
function initCanvas() {
  canvas = document.getElementById('graph-canvas');
  var wrap = document.getElementById('canvas-wrap');
  W = wrap.offsetWidth;
  H = Math.max(window.innerHeight - 170, 480);
  canvas.width = W;
  canvas.height = H;
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
}

// ─── build graph data ────────────────────────────────────
function buildGraph(mode) {
  gMode = mode;
  gNodes = [];
  gEdges = [];

  var u = getUser();
  var myId = String((u && u.dbId) || 1);
  // If this user has no watch history, fall back to the first user that does
  if (!DB.userWatched[myId]) {
    myId = Object.keys(DB.userWatched)[0];
  }

  if (mode === 'yours') {
    // Pick current user + neighbours who share watched movies
    var myWatched = (DB.userWatched[myId] || []);
    var mySet = new Set(myWatched.map(String));

    // Find other users sharing ≥2 movies
    var neighbors = [];
    Object.keys(DB.userWatched).forEach(function(uid) {
      if (uid === myId) return;
      var shared = (DB.userWatched[uid] || []).filter(function(m) { return mySet.has(String(m)); });
      if (shared.length >= 2) neighbors.push({uid: uid, shared: shared.length});
    });
    neighbors.sort(function(a,b) { return b.shared - a.shared; });
    neighbors = neighbors.slice(0, 7);

    var allUsers = [{uid: myId, isMe: true}].concat(neighbors.map(function(n) { return {uid: n.uid, isMe: false}; }));

    // Collect movies: only use movies that have DB metadata (no ? nodes)
    var movieSet = new Set();
    // User's own watched movies that have DB entries
    myWatched.forEach(function(m) { if (DB.movies[String(m)]) movieSet.add(String(m)); });
    // Neighbors' movies that have DB entries
    neighbors.forEach(function(n) {
      (DB.userWatched[n.uid] || []).forEach(function(m) { if (DB.movies[String(m)]) movieSet.add(String(m)); });
    });
    var movieIds = [...movieSet].sort(function(a,b){ var ao=mySet.has(a)?1:0,bo=mySet.has(b)?1:0; return bo-ao; }).slice(0,40);

    // ── Layout: TRUE BIPARTITE ──
    // Left column = Users, Right column = Movies
    var PAD_X = 100;
    var LEFT_X = PAD_X;
    var RIGHT_X = W - PAD_X;
    var usedH = H - 80;

    // Place users on left
    allUsers.forEach(function(u, i) {
      var y = 40 + (i + 0.5) * (usedH / allUsers.length);
      gNodes.push({
        id: 'u' + u.uid,
        type: 'user',
        label: u.isMe ? 'You (#' + u.uid + ')' : 'User #' + u.uid,
        shortLabel: u.isMe ? 'You' : '#' + u.uid,
        x: LEFT_X,
        y: y,
        color: u.isMe ? '#e8c97a' : '#5b8dee',
        r: u.isMe ? 14 : 11,
        mid: null,
        isMe: u.isMe
      });
    });

    // Place movies on right
    movieIds.forEach(function(mid, i) {
      var info = minfo(mid);
      var y = 40 + (i + 0.5) * (usedH / movieIds.length);
      var isWatched = mySet.has(mid);
      gNodes.push({
        id: 'm' + mid,
        type: 'movie',
        label: info ? cleanTitle(info[0]) : '?',
        shortLabel: info ? cleanTitle(info[0]).slice(0, 16) : '?',
        x: RIGHT_X,
        y: y,
        color: isWatched ? '#4ecb7f' : '#c8b878',
        r: isWatched ? 9 : 7,
        mid: +mid,
        rating: info ? info[2] : null
      });
    });

    // Build edges
    var nodeMap = {};
    gNodes.forEach(function(n) { nodeMap[n.id] = n; });

    allUsers.forEach(function(u) {
      var watched = DB.userWatched[u.uid] || [];
      watched.forEach(function(m) {
        var mId = 'm' + m;
        if (nodeMap[mId]) {
          gEdges.push({
            from: 'u' + u.uid,
            to: mId,
            isMe: u.isMe,
            alpha: u.isMe ? 0.55 : 0.18
          });
        }
      });
    });

  } else {
    // Full sample: show a slice of all users
    var sUsers = Object.keys(DB.userWatched).slice(0, 12);
    var movieSet2 = new Set();
    sUsers.forEach(function(uid) {
      (DB.userWatched[uid] || []).slice(0, 12).forEach(function(m) { movieSet2.add(String(m)); });
    });
    var movieIds2 = [...movieSet2].filter(function(m) { return DB.movies[m]; }).slice(0, 50);

    var PAD_X = 100, usedH = H - 80;
    var LEFT_X = PAD_X, RIGHT_X = W - PAD_X;

    sUsers.forEach(function(uid, i) {
      var y = 40 + (i + 0.5) * (usedH / sUsers.length);
      gNodes.push({
        id: 'u' + uid, type: 'user',
        label: 'User #' + uid, shortLabel: '#' + uid,
        x: LEFT_X, y: y,
        color: uid === myId ? '#e8c97a' : '#5b8dee',
        r: uid === myId ? 14 : 11,
        mid: null, isMe: uid === myId
      });
    });

    movieIds2.forEach(function(mid, i) {
      var info = minfo(mid);
      var y = 40 + (i + 0.5) * (usedH / movieIds2.length);
      gNodes.push({
        id: 'm' + mid, type: 'movie',
        label: info ? cleanTitle(info[0]) : '?',
        shortLabel: info ? cleanTitle(info[0]).slice(0, 16) : '?',
        x: RIGHT_X, y: y,
        color: '#c8b878', r: 7,
        mid: +mid,
        rating: info ? info[2] : null
      });
    });

    var nodeMap2 = {};
    gNodes.forEach(function(n) { nodeMap2[n.id] = n; });

    sUsers.forEach(function(uid) {
      (DB.userWatched[uid] || []).slice(0, 12).forEach(function(m) {
        var mId = 'm' + m;
        if (nodeMap2[mId]) {
          gEdges.push({ from: 'u' + uid, to: mId, isMe: uid === myId, alpha: uid === myId ? 0.5 : 0.15 });
        }
      });
    });
  }

  // Reset view to show full graph
  gPan = {x: 0, y: 0};
  gZoom = 1;

  document.getElementById('graph-stat').textContent =
    gNodes.filter(function(n){return n.type==='user';}).length + ' users · ' +
    gNodes.filter(function(n){return n.type==='movie';}).length + ' movies · ' +
    gEdges.length + ' connections';

  draw();
}

// ─── drawing ─────────────────────────────────────────────
function worldToScreen(x, y) {
  return { x: x * gZoom + gPan.x, y: y * gZoom + gPan.y };
}
function screenToWorld(sx, sy) {
  return { x: (sx - gPan.x) / gZoom, y: (sy - gPan.y) / gZoom };
}

function draw() {
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, H);

  // Column labels
  ctx.save();
  ctx.font = '600 11px Syne, sans-serif';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '0.1em';

  // Left label
  var leftX = (gNodes.find(function(n){return n.type==='user';})||{x:100}).x;
  var lPos = worldToScreen(leftX, 18);
  ctx.fillStyle = 'rgba(91,141,238,.6)';
  ctx.fillText('USERS', lPos.x, lPos.y);

  // Right label
  var rightX = (gNodes.find(function(n){return n.type==='movie';})||{x:W-100}).x;
  var rPos = worldToScreen(rightX, 18);
  ctx.fillStyle = 'rgba(200,184,120,.6)';
  ctx.fillText('MOVIES', rPos.x, rPos.y);
  ctx.restore();

  // Separator line (faint)
  var midX = worldToScreen((leftX + rightX) / 2, 0).x;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.moveTo(midX, 0); ctx.lineTo(midX, H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Build node map
  var nm = {};
  gNodes.forEach(function(n) { nm[n.id] = n; });

  // Draw edges (sorted: non-mine first, then mine on top)
  var sortedEdges = gEdges.slice().sort(function(a,b) { return (a.isMe?1:0)-(b.isMe?1:0); });

  sortedEdges.forEach(function(e) {
    var a = nm[e.from], b = nm[e.to];
    if (!a || !b) return;
    var sa = worldToScreen(a.x, a.y);
    var sb = worldToScreen(b.x, b.y);

    ctx.beginPath();
    ctx.moveTo(sa.x, sa.y);

    // Slight curve for readability
    var cpx = (sa.x + sb.x) / 2;
    var cpy = (sa.y + sb.y) / 2 - (e.isMe ? 0 : 8);
    ctx.quadraticCurveTo(cpx, cpy, sb.x, sb.y);

    if (e.isMe) {
      ctx.strokeStyle = 'rgba(78,203,127,' + e.alpha + ')';
      ctx.lineWidth = 1.5 * gZoom;
    } else {
      ctx.strokeStyle = 'rgba(200,184,120,' + e.alpha + ')';
      ctx.lineWidth = 0.8 * gZoom;
    }
    ctx.stroke();
  });

  // Draw nodes
  gNodes.forEach(function(n) {
    var s = worldToScreen(n.x, n.y);
    var r = n.r * Math.min(gZoom, 1.8);
    var isHov = hoveredNode && hoveredNode.id === n.id;

    // Glow
    if (n.r >= 11 || isHov) {
      var gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 3);
      var col = n.color;
      gr.addColorStop(0, col + '30');
      gr.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 3, 0, Math.PI * 2);
      ctx.fillStyle = gr; ctx.fill();
    }

    // Node circle
    ctx.beginPath(); ctx.arc(s.x, s.y, r + (isHov ? 2 : 0), 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();

    // Border
    ctx.strokeStyle = isHov ? '#fff' : 'rgba(255,255,255,.25)';
    ctx.lineWidth = isHov ? 2 : 1;
    ctx.stroke();

    // Label
    var fontSize = Math.max(9, Math.min(13, 11 * gZoom));
    ctx.font = n.type === 'user' ? ('600 ' + fontSize + 'px Syne,sans-serif') : (fontSize + 'px JetBrains Mono,monospace');
    ctx.textAlign = n.type === 'user' ? 'right' : 'left';
    ctx.fillStyle = isHov ? '#fff' : 'rgba(255,255,255,.75)';

    var labelX = n.type === 'user' ? s.x - r - 6 : s.x + r + 6;
    var label = n.shortLabel;
    if (gZoom < 0.5) {
      // At very low zoom, skip labels for movies
      if (n.type === 'movie') return;
    }
    ctx.fillText(label, labelX, s.y + fontSize * 0.35);
  });
}

// ─── tooltip ─────────────────────────────────────────────
function showTooltip(node, sx, sy) {
  var tip = document.getElementById('node-tooltip');
  var html = '';
  if (node.type === 'movie') {
    var info = minfo(node.mid);
    if (info) {
      html = '<strong>' + cleanTitle(info[0]) + '</strong><br>';
      html += info[1].replace(/\|/g,', ') + '<br>';
      html += '⭐ ' + info[2].toFixed(1) + ' · ' + info[3] + ' ratings';
    }
  } else {
    var cnt = (DB.userWatched[node.id.replace('u','')] || []).length;
    html = '<strong>' + node.label + '</strong><br>' + cnt + ' movies watched';
  }
  tip.innerHTML = html;
  tip.style.left = Math.min(sx + 14, W - 220) + 'px';
  tip.style.top = Math.max(sy - 40, 4) + 'px';
  tip.classList.add('show');
}
function hideTooltip() {
  document.getElementById('node-tooltip').classList.remove('show');
}

// ─── hit testing ─────────────────────────────────────────
function hitTest(sx, sy) {
  var wp = screenToWorld(sx, sy);
  var hit = null;
  var bestD = Infinity;
  gNodes.forEach(function(n) {
    var d = Math.hypot(n.x - wp.x, n.y - wp.y);
    var threshold = n.r / Math.min(gZoom, 1) + 6;
    if (d < threshold && d < bestD) { bestD = d; hit = n; }
  });
  return hit;
}

// ─── events ──────────────────────────────────────────────
function bindEvents() {
  // Mouse
  canvas.addEventListener('mousedown', function(e) {
    isDragging = true;
    dragStart = {x: e.clientX, y: e.clientY};
    panStart = {x: gPan.x, y: gPan.y};
  });

  window.addEventListener('mouseup', function() { isDragging = false; });

  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;

    if (isDragging) {
      hideTooltip();
      gPan.x = panStart.x + (e.clientX - dragStart.x);
      gPan.y = panStart.y + (e.clientY - dragStart.y);
      draw();
      return;
    }

    var node = hitTest(sx, sy);
    if (node !== hoveredNode) {
      hoveredNode = node;
      canvas.style.cursor = node ? 'pointer' : 'grab';
      draw();
    }
    if (node) {
      showTooltip(node, sx, sy);
    } else {
      hideTooltip();
    }
  });

  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;
    var factor = e.deltaY < 0 ? 1.12 : 0.9;
    var newZoom = Math.max(0.15, Math.min(8, gZoom * factor));
    // Zoom toward cursor
    gPan.x = sx - (sx - gPan.x) * (newZoom / gZoom);
    gPan.y = sy - (sy - gPan.y) * (newZoom / gZoom);
    gZoom = newZoom;
    draw();
  }, {passive: false});

  canvas.addEventListener('click', function(e) {
    var rect = canvas.getBoundingClientRect();
    var node = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    if (node && node.type === 'movie' && node.mid) {
      window.location.href = 'movie.html?id=' + node.mid;
    }
  });

  // Touch
  var lastTouchDist = null;
  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      isDragging = true;
      dragStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      panStart = {x: gPan.x, y: gPan.y};
    } else if (e.touches.length === 2) {
      lastTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, {passive: true});

  canvas.addEventListener('touchend', function() { isDragging = false; lastTouchDist = null; });

  canvas.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && isDragging) {
      gPan.x = panStart.x + (e.touches[0].clientX - dragStart.x);
      gPan.y = panStart.y + (e.touches[0].clientY - dragStart.y);
      draw();
    } else if (e.touches.length === 2 && lastTouchDist !== null) {
      var d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      gZoom = Math.max(0.15, Math.min(8, gZoom * (d / lastTouchDist)));
      lastTouchDist = d;
      draw();
    }
  }, {passive: true});
}

// ─── reset view to fit all nodes ─────────────────────────
function resetView() {
  if (!gNodes.length) return;
  // Fit all nodes in view with padding
  var pad = 60;
  gZoom = 1;
  gPan = {x: 0, y: 0};
  draw();
}

// ─── init ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  if (!requireAuth()) return;
  buildNav('graph');

  setTimeout(function() {
    initCanvas();
    bindEvents();
    buildGraph('yours');

    document.getElementById('gbtn-yours').addEventListener('click', function() {
      document.querySelectorAll('.gc-btn').forEach(function(b){b.classList.remove('on');});
      this.classList.add('on');
      buildGraph('yours');
    });
    document.getElementById('gbtn-full').addEventListener('click', function() {
      document.querySelectorAll('.gc-btn').forEach(function(b){b.classList.remove('on');});
      this.classList.add('on');
      buildGraph('full');
    });
    document.getElementById('gbtn-reset').addEventListener('click', function() {
      resetView();
    });

    window.addEventListener('resize', function() {
      initCanvas();
      draw();
    });
  }, 80);
});
</script>
