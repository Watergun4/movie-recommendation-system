<script>
var gNodes=[],gEdges=[],gPan={x:0,y:0},gZoom=1,gMode='yours';
var canvas,ctx,W,H;

function initCanvas(){
  canvas=document.getElementById('graph-canvas');
  var wrap=document.getElementById('canvas-wrap');
  W=wrap.offsetWidth;
  H=Math.max(window.innerHeight-160,400);
  canvas.width=W; canvas.height=H;
  canvas.style.height=H+'px';
}

function buildGraph(mode){
  initCanvas();
  gNodes=[];gEdges=[];
  gPan={x:W/2,y:H/2};gZoom=1;
  var u=getUser(), dbId=(u&&u.dbId)||1;
  if(mode==='yours'){
    var myM=(DB.userWatched[String(dbId)]||[]).slice(0,25);
    var uSet=new Set([String(dbId)]);
    myM.forEach(function(mid){
      Object.entries(DB.userWatched).slice(0,50).forEach(function(e){
        if((e[1]||[]).indexOf(mid)!==-1&&e[0]!==String(dbId)) uSet.add(e[0]);
      });
    });
    var users=[...uSet].slice(0,10);
    var r1=Math.min(W,H)*0.18, r2=Math.min(W,H)*0.38;
    users.forEach(function(uid,i){
      var a=(i/users.length)*Math.PI*2;
      var isMe=uid===String(dbId);
      gNodes.push({id:'u'+uid,type:'user',label:'#'+uid,
        x:Math.cos(a)*r1,y:Math.sin(a)*r1,
        color:isMe?'#e8c97a':'#5b8dee',r:isMe?14:9,mid:null});
    });
    var mset=new Set();
    users.forEach(function(uid){(DB.userWatched[uid]||[]).slice(0,10).forEach(function(mid){mset.add(mid);});});
    [...mset].slice(0,50).forEach(function(mid,i){
      var a=(i/Math.min([...mset].length,50))*Math.PI*2;
      var inf=minfo(mid); var isW2=isW(+mid);
      gNodes.push({id:'m'+mid,type:'movie',label:inf?cleanT(inf[0]).slice(0,14):'?',
        x:Math.cos(a)*r2,y:Math.sin(a)*r2,
        color:isW2?'#4ecb7f':'#c8b878',r:isW2?8:5,mid:+mid});
    });
    users.forEach(function(uid){
      (DB.userWatched[uid]||[]).slice(0,10).forEach(function(mid){
        if(gNodes.find(function(n){return n.id==='m'+mid;}))
          gEdges.push({from:'u'+uid,to:'m'+mid,mine:uid===String(dbId)});
      });
    });
  } else {
    var sU=Object.keys(DB.userWatched).slice(0,14);
    var sM=new Set();
    sU.forEach(function(uid){(DB.userWatched[uid]||[]).slice(0,8).forEach(function(mid){sM.add(mid);});});
    var r3=Math.min(W,H)*0.2, r4=Math.min(W,H)*0.4;
    sU.forEach(function(uid,i){
      var a=(i/sU.length)*Math.PI*2;
      gNodes.push({id:'u'+uid,type:'user',label:'#'+uid,x:Math.cos(a)*r3,y:Math.sin(a)*r3,color:'#5b8dee',r:10,mid:null});
    });
    [...sM].slice(0,50).forEach(function(mid,i){
      var a=(i/50)*Math.PI*2,inf=minfo(mid);
      gNodes.push({id:'m'+mid,type:'movie',label:inf?cleanT(inf[0]).slice(0,13):'?',x:Math.cos(a)*r4,y:Math.sin(a)*r4,color:'#c8b878',r:5,mid:+mid});
    });
    sU.forEach(function(uid){(DB.userWatched[uid]||[]).slice(0,8).forEach(function(mid){
      if(gNodes.find(function(n){return n.id==='m'+mid;}))
        gEdges.push({from:'u'+uid,to:'m'+mid,mine:false});
    });});
  }
  document.getElementById('graph-stat').textContent=gNodes.length+' nodes · '+gEdges.length+' edges';
  drawGraph();
}

function drawGraph(){
  if(!ctx){ctx=canvas.getContext('2d');}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // dark bg
  ctx.fillStyle='#07070f';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(gPan.x,gPan.y);ctx.scale(gZoom,gZoom);
  var nm={};gNodes.forEach(function(n){nm[n.id]=n;});
  // edges
  gEdges.forEach(function(e){
    var a=nm[e.from],b=nm[e.to];if(!a||!b)return;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=e.mine?'rgba(78,203,127,.45)':'rgba(255,255,255,.055)';
    ctx.lineWidth=e.mine?1.5:.6;ctx.stroke();
  });
  // nodes
  gNodes.forEach(function(n){
    // glow for bigger nodes
    if(n.r>8){
      var grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*3);
      grad.addColorStop(0,n.color.replace('#','rgba(').replace(/^rgba\(/,'rgba(')+',.15)');
      grad.addColorStop(1,'transparent');
      try{ctx.beginPath();ctx.arc(n.x,n.y,n.r*3,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();}catch(e){}
    }
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;ctx.fill();
    if(n.r>6){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5;ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.65)';
    ctx.font='bold '+Math.max(8,Math.round(9/Math.max(1,gZoom*0.5)))+'px JetBrains Mono,monospace';
    ctx.textAlign='center';
    ctx.fillText(n.label,n.x,n.y+n.r+11);
  });
  ctx.restore();
}

var isDragging=false,lastX=0,lastY=0;
function bindEvents(){
  canvas.addEventListener('mousedown',function(e){isDragging=true;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener('mouseup',function(){isDragging=false;});
  canvas.addEventListener('mousemove',function(e){
    if(!isDragging)return;
    gPan.x+=e.clientX-lastX;gPan.y+=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;drawGraph();
  });
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    gZoom=Math.max(.2,Math.min(5,gZoom*(e.deltaY<0?1.12:.9)));drawGraph();
  },{passive:false});
  canvas.addEventListener('click',function(e){
    if(isDragging)return;
    var rect=canvas.getBoundingClientRect();
    var mx=(e.clientX-rect.left-gPan.x)/gZoom,my=(e.clientY-rect.top-gPan.y)/gZoom;
    var hit=null;
    gNodes.forEach(function(n){if(Math.hypot(n.x-mx,n.y-my)<n.r+6)hit=n;});
    if(hit&&hit.type==='movie'&&hit.mid) window.location.href='movie.html?id='+hit.mid;
    if(hit&&hit.type==='user'){
      var info=document.getElementById('node-info');
      var cnt=(DB.userWatched[hit.id.replace('u','')]||[]).length;
      document.getElementById('node-info-content').textContent=hit.label+' · '+cnt+' films watched';
      info.classList.add('show');
      setTimeout(function(){info.classList.remove('show');},2000);
    }
  });
  // touch support
  canvas.addEventListener('touchstart',function(e){if(e.touches.length===1){isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}},{passive:true});
  canvas.addEventListener('touchend',function(){isDragging=false;});
  canvas.addEventListener('touchmove',function(e){
    if(!isDragging||e.touches.length!==1)return;
    gPan.x+=e.touches[0].clientX-lastX;gPan.y+=e.touches[0].clientY-lastY;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;drawGraph();
  },{passive:true});
}

document.addEventListener('DOMContentLoaded',function(){
  if(!requireAuth()) return;
  buildNav('graph');
  ctx=null;
  // wait for layout
  setTimeout(function(){
    initCanvas();
    ctx=canvas.getContext('2d');
    bindEvents();
    buildGraph('yours');
  },100);
  document.getElementById('gbtn-yours').addEventListener('click',function(){
    document.querySelectorAll('.gc-btn').forEach(function(b){b.classList.remove('on');});
    this.classList.add('on');buildGraph('yours');
  });
  document.getElementById('gbtn-full').addEventListener('click',function(){
    document.querySelectorAll('.gc-btn').forEach(function(b){b.classList.remove('on');});
    this.classList.add('on');buildGraph('full');
  });
  document.getElementById('gbtn-reset').addEventListener('click',function(){
    gPan={x:W/2,y:H/2};gZoom=1;drawGraph();
  });
  window.addEventListener('resize',function(){
    initCanvas();ctx=canvas.getContext('2d');drawGraph();
  });
});
